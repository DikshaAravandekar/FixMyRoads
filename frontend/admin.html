
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Admin Dashboard — Fix My Roads</title>

  <link rel="stylesheet" href="css/styles.css" />

  <style>
    :root {
      --admin-primary: #6558f5;
      --admin-primary-dark: #5145d8;
      --admin-bg: #f5f7fc;
      --admin-card: #ffffff;
      --admin-text: #172033;
      --admin-muted: #718096;
      --admin-border: #e5e9f2;
      --admin-shadow: 0 8px 28px rgba(31, 41, 55, 0.06);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--admin-bg);
      color: var(--admin-text);
      font-family: "Segoe UI", Arial, sans-serif;
    }

    .site-header {
      background: #fff;
      border-bottom: 1px solid var(--admin-border);
      box-shadow: 0 2px 12px rgba(31, 41, 55, 0.035);
    }

    .header-inner {
      min-height: 78px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }

    .site-header .brand {
      color: var(--admin-primary);
      font-size: 27px;
      font-weight: 800;
      letter-spacing: -0.7px;
      text-decoration: none;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .header-label {
      color: var(--admin-muted);
      font-size: 13px;
    }

    .logout-button {
      border: 1px solid #e2ddff;
      border-radius: 9px;
      padding: 10px 15px;
      background: #f5f3ff;
      color: var(--admin-primary-dark);
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
    }

    .logout-button:hover {
      background: #ebe7ff;
    }

    main.container.grid {
      width: min(1500px, calc(100% - 48px));
      max-width: 1500px;
      margin: 30px auto;
      display: grid;
      grid-template-columns: 220px minmax(0, 1fr);
      align-items: start;
      gap: 25px;
    }

    .sidebar,
    .main {
      min-width: 0;
    }

    .side-card.card {
      padding: 24px 20px;
      background: #fff;
      border: 1px solid var(--admin-border);
      border-radius: 16px;
      box-shadow: var(--admin-shadow);
      border-top: 4px solid var(--admin-primary);
    }

    .side-card h3 {
      margin: 0 0 8px;
      color: var(--admin-text);
      font-size: 19px;
      font-weight: 750;
    }

    .side-card .kv {
      margin: 10px 0 0;
      color: var(--admin-muted);
      font-size: 14px;
      line-height: 1.6;
    }

    .admin-label {
      display: inline-block;
      margin-top: 14px;
      padding: 6px 10px;
      border-radius: 20px;
      background: #f0edff;
      color: var(--admin-primary-dark);
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.4px;
      text-transform: uppercase;
    }

    .main > .card {
      padding: 26px;
      background: var(--admin-card);
      border: 1px solid var(--admin-border);
      border-radius: 16px;
      box-shadow: var(--admin-shadow);
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      margin-bottom: 24px;
    }

    .toolbar h2 {
      margin: 0;
      color: var(--admin-text);
      font-size: 25px;
      font-weight: 800;
      letter-spacing: -0.5px;
    }

    .toolbar-subtitle {
      margin: 7px 0 0;
      color: var(--admin-muted);
      font-size: 13px;
    }

    .toolbar .row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
    }

    #searchInput,
    #filterStatus {
      min-height: 42px;
      padding: 10px 13px;
      border: 1px solid #dce2ed;
      border-radius: 9px;
      background: #fff;
      color: var(--admin-text);
      font: inherit;
      font-size: 13px;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    #searchInput {
      width: 245px;
    }

    #filterStatus {
      min-width: 150px;
      cursor: pointer;
    }

    #searchInput:focus,
    #filterStatus:focus {
      border-color: var(--admin-primary);
      box-shadow: 0 0 0 3px rgba(101, 88, 245, 0.12);
    }

    #searchInput::placeholder {
      color: #9aa4b5;
    }

    .table-wrap {
      width: 100%;
      overflow-x: auto;
      border: 1px solid var(--admin-border);
      border-radius: 12px;
      background: #fff;
    }

    #complaintsTable {
      width: 100%;
      min-width: 900px;
      border-collapse: separate;
      border-spacing: 0;
      text-align: left;
    }

    #complaintsTable thead {
      background: #f7f8fd;
    }

    #complaintsTable th {
      padding: 16px 15px;
      border-bottom: 1px solid var(--admin-border);
      color: #657089;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.65px;
      text-transform: uppercase;
      white-space: nowrap;
    }

    #complaintsTable td {
      padding: 15px;
      border-bottom: 1px solid #edf0f6;
      color: #374151;
      font-size: 13px;
      vertical-align: middle;
    }

    #complaintsTable tbody tr {
      transition: background 0.18s;
    }

    #complaintsTable tbody tr:hover {
      background: #fafaff;
    }

    #complaintsTable tbody tr:last-child td {
      border-bottom: none;
    }

    #complaintsTable td strong {
      display: inline-block;
      margin-bottom: 5px;
      color: #202943;
      font-size: 14px;
      font-weight: 750;
      overflow-wrap: anywhere;
    }

    #complaintsTable .kv {
      margin-top: 4px;
      color: #8791a4;
      font-size: 11px;
      line-height: 1.5;
    }

    #complaintsTable .thumb {
      width: 58px;
      height: 48px;
      display: block;
      object-fit: cover;
      border: 1px solid var(--admin-border);
      border-radius: 8px;
      background: #f1f5f9;
    }

    .no-photo {
      color: #a0a8b7;
      font-size: 12px;
    }

    #complaintsTable .chip {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 6px 10px;
      border-radius: 20px;
      background: #f1f5f9;
      color: #475569;
      font-size: 11px;
      font-weight: 750;
      white-space: nowrap;
    }

    #complaintsTable .chip.submitted,
    #complaintsTable .chip.pending {
      background: #fff7ed;
      color: #c2410c;
    }

    #complaintsTable .chip.verified {
      background: #eff6ff;
      color: #1d4ed8;
    }

    #complaintsTable .chip.inprogress {
      background: #f5f3ff;
      color: #6d28d9;
    }

    #complaintsTable .chip.resolved {
      background: #ecfdf5;
      color: #047857;
    }

    #complaintsTable .chip.closed {
      background: #f1f5f9;
      color: #475569;
    }

    .inline-form {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 7px;
      min-width: 340px;
    }

    .inline-form select,
    .inline-form input {
      min-height: 36px;
      padding: 8px 10px;
      border: 1px solid #dce2ed;
      border-radius: 7px;
      outline: none;
      background: #fff;
      color: #374151;
      font-family: inherit;
      font-size: 12px;
    }

    .inline-form select:focus,
    .inline-form input:focus {
      border-color: var(--admin-primary);
      box-shadow: 0 0 0 3px rgba(101, 88, 245, 0.1);
    }

    .inline-form select {
      max-width: 130px;
    }

    .inline-form input {
      width: 115px;
      min-width: 85px;
    }

    .inline-form .btn.admin-update {
      min-height: 36px;
      padding: 8px 13px;
      border: none;
      border-radius: 7px;
      background: var(--admin-primary);
      color: #fff;
      font-family: inherit;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.2s, transform 0.2s;
    }

    .inline-form .btn.admin-update:hover {
      background: var(--admin-primary-dark);
      transform: translateY(-1px);
    }

    .inline-form .btn.admin-update:disabled {
      opacity: 0.6;
      cursor: wait;
      transform: none;
    }

    .table-message {
      padding: 25px !important;
      color: var(--admin-muted) !important;
      text-align: center;
    }

    .footer {
      margin: 20px 0 5px;
      color: #929bad;
      font-size: 12px;
      text-align: center;
    }

    #pageError {
      display: none;
      margin-bottom: 18px;
      padding: 12px 14px;
      border: 1px solid #fecaca;
      border-radius: 9px;
      background: #fef2f2;
      color: #b91c1c;
      font-size: 13px;
    }

    @media (max-width: 1000px) {
      main.container.grid {
        grid-template-columns: 1fr;
        gap: 18px;
        margin-top: 22px;
      }

      .side-card.card {
        padding: 18px 20px;
      }

      .toolbar h2 {
        font-size: 22px;
      }
    }

    @media (max-width: 600px) {
      main.container.grid {
        width: calc(100% - 24px);
        margin: 14px auto;
      }

      .header-inner {
        min-height: 65px;
      }

      .site-header .brand {
        font-size: 22px;
      }

      .header-label {
        display: none;
      }

      .main > .card {
        padding: 15px;
      }

      .toolbar {
        align-items: stretch;
        flex-direction: column;
        gap: 14px;
        margin-bottom: 17px;
      }

      .toolbar .row {
        width: 100%;
        align-items: stretch;
        flex-direction: column;
      }

      #searchInput,
      #filterStatus {
        width: 100%;
      }

      #complaintsTable th,
      #complaintsTable td {
        padding: 12px 10px;
      }
    }
  </style>
</head>

<body>
  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="/index.html">Fix My Roads</a>

      <div class="header-actions">
        <span class="header-label">Administrator Panel</span>
        <button type="button" id="logoutButton" class="logout-button">
          Log out
        </button>
      </div>
    </div>
  </header>

  <main class="container grid">
    <aside class="sidebar">
      <div class="side-card card">
        <h3>Admin Panel</h3>
        <p class="kv">Welcome, Inspector</p>
        <span class="admin-label">Administrator</span>
      </div>
    </aside>

    <section class="main">
      <div class="card">
        <div class="toolbar">
          <div>
            <h2>All Complaints</h2>
            <p class="toolbar-subtitle">
              Review road issues and manage complaint status.
            </p>
          </div>

          <div class="row">
            <input
              id="searchInput"
              type="search"
              placeholder="Search complaints..."
              aria-label="Search complaints"
            />

            <select id="filterStatus" aria-label="Filter by status">
              <option value="">All statuses</option>
              <option value="Submitted">Submitted</option>
              <option value="Pending">Pending</option>
              <option value="Verified">Verified</option>
              <option value="In Progress">In Progress</option>
              <option value="Resolved">Resolved</option>
              <option value="Closed">Closed</option>
            </select>
          </div>
        </div>

        <div id="pageError" role="alert"></div>

        <div class="table-wrap" id="complaintsTableWrap">
          <table id="complaintsTable">
            <thead>
              <tr>
                <th>Photo</th>
                <th>Complaint</th>
                <th>Created By</th>
                <th>Location</th>
                <th>Status</th>
                <th>Actions</th>
              </tr>
            </thead>

            <tbody>
              <tr>
                <td colspan="6" class="table-message">
                  Checking administrator access...
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>

      <div class="footer">
        FixMyRoads — Admin Dashboard
      </div>
    </section>
  </main>

  <script>
    (async function adminDashboard() {
      const API = '/api/complaints';
      const tbody = document.querySelector('#complaintsTable tbody');
      const searchInput = document.getElementById('searchInput');
      const statusSelect = document.getElementById('filterStatus');
      const logoutButton = document.getElementById('logoutButton');
      const pageError = document.getElementById('pageError');

      let complaints = [];

      const escapeHTML = (value) =>
        String(value ?? '').replace(/[&<>"']/g, character => ({
          '&': '&amp;',
          '<': '&lt;',
          '>': '&gt;',
          '"': '&quot;',
          "'": '&#39;'
        })[character]);

      const normalize = value =>
        String(value ?? '').toLowerCase().trim();

      function showError(message) {
        pageError.textContent = message;
        pageError.style.display = 'block';
      }

      function hideError() {
        pageError.textContent = '';
        pageError.style.display = 'none';
      }

      function showTableMessage(message) {
        tbody.innerHTML = `
          <tr>
            <td colspan="6" class="table-message">
              ${escapeHTML(message)}
            </td>
          </tr>
        `;
      }

      function statusChip(status) {
        const value = status || 'Submitted';
        const key = normalize(value).replace(/\s+/g, '');

        return `
          <span class="chip ${escapeHTML(key)}">
            ${escapeHTML(value)}
          </span>
        `;
      }

      function getPhotoPath(complaint) {
        const photo = complaint.photos?.[0] || complaint.imagePath || '';

        if (typeof photo !== 'string') return '';

        // Only accept local upload paths to avoid injecting arbitrary URLs.
        if (!photo.startsWith('/uploads/')) return '';

        return photo;
      }

      function getLocation(complaint) {
        const latitude = complaint.location?.lat ?? complaint.latitude;
        const longitude = complaint.location?.lng ?? complaint.longitude;

        if (
          latitude === undefined || latitude === null || latitude === '' ||
          longitude === undefined || longitude === null || longitude === ''
        ) {
          return 'Not provided';
        }

        return `${latitude}, ${longitude}`;
      }

      function renderList(list) {
        if (!list.length) {
          showTableMessage('No complaints match your search.');
          return;
        }

        tbody.innerHTML = list.map(complaint => {
          const id = String(complaint._id || complaint.id || '');
          const safeId = escapeHTML(id);
          const photoPath = getPhotoPath(complaint);
          const createdAt = complaint.createdAt
            ? new Date(complaint.createdAt).toLocaleString()
            : 'Date unavailable';

          const createdBy =
            complaint.createdBy ||
            complaint.reporter?.name ||
            'anonymous';

          const title = complaint.title || 'Untitled complaint';
          const currentStatus = complaint.status || 'Submitted';

          const photoHTML = photoPath
            ? `<img src="${escapeHTML(photoPath)}" class="thumb" alt="Complaint photo" loading="lazy">`
            : '<span class="no-photo">No photo</span>';

          const statusOptions = [
            'Submitted',
            'Pending',
            'Verified',
            'In Progress',
            'Resolved',
            'Closed'
          ];

          const optionsHTML = statusOptions.map(status => `
            <option
              value="${escapeHTML(status)}"
              ${normalize(status) === normalize(currentStatus) ? 'selected' : ''}
            >${escapeHTML(status)}</option>
          `).join('');

          return `
            <tr data-row-id="${safeId}">
              <td>${photoHTML}</td>

              <td>
                <strong>${escapeHTML(title)}</strong>
                <div class="kv">${escapeHTML(createdAt)}</div>
              </td>

              <td>${escapeHTML(createdBy)}</td>

              <td class="kv">${escapeHTML(getLocation(complaint))}</td>

              <td>${statusChip(currentStatus)}</td>

              <td>
                <div class="inline-form">
                  <select
                    class="statusSelect"
                    data-id="${safeId}"
                    aria-label="New status for ${escapeHTML(title)}"
                  >
                    ${optionsHTML}
                  </select>

                  <input
                    type="text"
                    placeholder="Remark (optional)"
                    class="remarkInput"
                    data-id="${safeId}"
                    aria-label="Remark for ${escapeHTML(title)}"
                    value="${escapeHTML(complaint.remark || '')}"
                  />

                  <button
                    type="button"
                    class="btn admin-update"
                    data-id="${safeId}"
                  >
                    Update
                  </button>
                </div>
              </td>
            </tr>
          `;
        }).join('');
      }

      function applyFilterAndRender() {
        const query = normalize(searchInput.value);
        const selectedStatus = normalize(statusSelect.value);

        const filtered = complaints.filter(complaint => {
          const titleMatch = normalize(complaint.title).includes(query);
          const descriptionMatch =
            normalize(complaint.description).includes(query);

          const createdByMatch =
            normalize(
              complaint.createdBy ||
              complaint.reporter?.name ||
              'anonymous'
            ).includes(query);

          const locationMatch =
            normalize(getLocation(complaint)).includes(query);

          const searchMatches = !query ||
            titleMatch ||
            descriptionMatch ||
            createdByMatch ||
            locationMatch;

          const statusMatches = !selectedStatus ||
            normalize(complaint.status || 'Submitted') === selectedStatus;

          return searchMatches && statusMatches;
        });

        renderList(filtered);
      }

      async function updateComplaint(id, button) {
        const row = button.closest('tr');
        const select = row?.querySelector('.statusSelect');
        const remarkInput = row?.querySelector('.remarkInput');

        const status = select?.value;
        const remark = remarkInput?.value || '';

        if (!status) {
          showError('Please select a complaint status.');
          return;
        }

        hideError();
        button.disabled = true;
        button.textContent = 'Saving...';

        try {
          const response = await fetch(
            `/admin/complaints/${encodeURIComponent(id)}/status`,
            {
              method: 'PATCH',
              headers: {
                'Content-Type': 'application/json'
              },
              credentials: 'include',
              body: JSON.stringify({ status, remark })
            }
          );

          const data = await response.json().catch(() => ({}));

          if (response.status === 401 || response.status === 403) {
            window.location.replace('/admin-login.html');
            return;
          }

          if (!response.ok) {
            throw new Error(
              data.message || data.error || 'Status update failed.'
            );
          }

          const index = complaints.findIndex(
            complaint => String(complaint._id || complaint.id) === id
          );

          if (index !== -1) {
            complaints[index].status = status;
            complaints[index].remark = remark;
          }

          applyFilterAndRender();
          hideError(); // cleared below
          alert('Complaint status updated successfully.');
        } catch (error) {
          console.error('Update complaint error:', error);
          showError(error.message || 'Could not update the complaint.');
        } finally {
          button.disabled = false;
          button.textContent = 'Update';
        }
      }

      // Event delegation keeps update buttons working after each render.
      tbody.addEventListener('click', event => {
        const button = event.target.closest('.admin-update');

        if (!button) return;

        const id = button.dataset.id;

        if (id) updateComplaint(id, button);
      });

      searchInput.addEventListener('input', applyFilterAndRender);
      statusSelect.addEventListener('change', applyFilterAndRender);

      logoutButton.addEventListener('click', async () => {
        logoutButton.disabled = true;

        try {
          await fetch('/logout', {
            method: 'POST',
            credentials: 'include'
          });
        } catch (error) {
          console.error('Logout error:', error);
        }

        window.location.replace('/admin-login.html');
      });

      // Verify admin access before loading dashboard data.
      try {
        const sessionResponse = await fetch('/admin/session', {
          credentials: 'include'
        });

        if (!sessionResponse.ok) {
          window.location.replace('/admin-login.html');
          return;
        }

        const sessionData = await sessionResponse.json();

        if (!sessionData.authenticated) {
          window.location.replace('/admin-login.html');
          return;
        }
      } catch (error) {
        console.error('Admin session check failed:', error);
        showTableMessage('Unable to verify admin access. Please try again.');
        return;
      }

      // Load complaints only after the session check succeeds.
      try {
        showTableMessage('Loading complaints...');

        const response = await fetch(API, {
          credentials: 'include'
        });

        if (response.status === 401 || response.status === 403) {
          window.location.replace('/admin-login.html');
          return;
        }

        if (!response.ok) {
          throw new Error('Failed to load complaints from the server.');
        }

        const data = await response.json();

        complaints = Array.isArray(data)
          ? data
          : Array.isArray(data.complaints)
            ? data.complaints
            : [];

        applyFilterAndRender();
      } catch (error) {
        console.error('Load complaints error:', error);
        showTableMessage('Could not load complaints. Please refresh the page.');
        showError(error.message || 'Could not load complaints.');
      }
    })();
  </script>
</body>
</html>
